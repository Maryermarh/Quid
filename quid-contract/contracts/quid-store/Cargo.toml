[package]
name = "quid-store"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
quid-fee-collector = { path = "../quid-fee-collector" }
quid-staking = { path = "../quid-staking" }
quid-moderation-registry = { path = "../quid-moderation-registry" }
